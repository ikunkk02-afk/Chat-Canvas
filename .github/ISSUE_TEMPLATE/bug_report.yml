name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the issue.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can the issue be reproduced?
      placeholder: |
        1. Open the editor
        2. Switch to the Text page
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: mc_version
    attributes:
      label: Minecraft Version
      placeholder: "1.21.5"
    validations:
      required: true

  - type: input
    id: cc_version
    attributes:
      label: Chat Canvas Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: Fabric Loader Version
      placeholder: "0.19.3"

  - type: input
    id: fabric_api
    attributes:
      label: Fabric API Version
      placeholder: "0.128.2"

  - type: input
    id: owo_lib
    attributes:
      label: owo-lib Version
      placeholder: "0.12.21"

  - type: input
    id: gui_scale
    attributes:
      label: GUI Scale
      placeholder: "Auto / 2 / 3 / 4"

  - type: textarea
    id: mod_list
    attributes:
      label: Other Mods Installed
      description: Especially chat-related mods (Chat Heads, More Chat History, ChatAnimation, Smooth Scrolling, etc.)

  - type: textarea
    id: logs
    attributes:
      label: Latest Log
      description: Upload `latest.log` from `.minecraft/logs/` (use a paste service or drag the file)
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Video
      description: If applicable, add screenshots or video to help explain the issue.

  - type: checkboxes
    id: verification
    attributes:
      label: Before Submitting
      options:
        - label: I have tested with only Fabric API, owo-lib, and Chat Canvas installed
        - label: I have the latest version of Chat Canvas
        - label: I have checked that this issue is not already reported
