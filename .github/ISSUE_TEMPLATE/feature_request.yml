name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you'd like to see.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What feature would you like?
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: How would you use this feature? What problem does it solve?

  - type: textarea
    id: suggested_ui
    attributes:
      label: Suggested Interaction
      description: How should the feature work from a user's perspective?

  - type: textarea
    id: existing
    attributes:
      label: Existing Mods
      description: Does this overlap with any existing mod's functionality? If so, how should it differ?
