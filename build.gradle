plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { name = "WispForest"; url = "https://maven.wispforest.io/releases" }
	maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases" }
	maven { name = "BMCLAPI"; url = "https://bmclapi2.bangbang93.com/maven" }
	mavenCentral()
	ivy {
		name = "SherpaOnnxRelease"
		url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4"
		patternLayout { artifact "[artifact]-[revision].[ext]" }
		metadataSources { artifact() }
		content { includeModule "com.k2fsa.sherpa.onnx", "sherpa-onnx-jvm" }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods { "chat_canvas" { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
	implementation("com.alphacephei:vosk:0.3.45") { exclude group: "net.java.dev.jna", module: "jna" }
	include("com.alphacephei:vosk:0.3.45") { transitive = false }
	implementation("com.k2fsa.sherpa.onnx:sherpa-onnx-jvm:1.13.4@jar")
	include("com.k2fsa.sherpa.onnx:sherpa-onnx-jvm:1.13.4@jar") { transitive = false }
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	if (providers.gradleProperty("withModMenu").map(String::toBoolean).getOrElse(false)) {
		modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	}
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
tasks.named("test") { useJUnitPlatform() }

java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

jar {
	inputs.property "projectName", project.name
	from("LICENSE") { rename { "${it}_${project.name}" } }
	from("THIRD_PARTY_LICENSES.md")
}
