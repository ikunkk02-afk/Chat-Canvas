plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "WispForest"
		url = "https://maven.wispforest.io/releases"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases"
	}
	ivy {
		name = "SherpaOnnxRelease"
		url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4"
		patternLayout {
			artifact "[artifact]-[revision].[ext]"
		}
		metadataSources {
			artifact()
		}
		content {
			includeModule "com.k2fsa.sherpa.onnx", "sherpa-onnx-jvm"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chat_canvas" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Keep the original client-side layout/font regression tests runnable after
// Loom splits the production source sets into common and client classpaths.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + configurations.clientCompileClasspath
		runtimeClasspath += sourceSets.client.output + configurations.clientRuntimeClasspath
	}
}

tasks.named("test") {
	dependsOn(tasks.named("clientClasses"))
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "io.wispforest:owo-lib:${project.owo_version}"
	implementation("com.alphacephei:vosk:0.3.45") {
		exclude group: "net.java.dev.jna", module: "jna"
	}
	include("com.alphacephei:vosk:0.3.45") {
		transitive = false
	}
	implementation("com.k2fsa.sherpa.onnx:sherpa-onnx-jvm:1.13.4@jar")
	include("com.k2fsa.sherpa.onnx:sherpa-onnx-jvm:1.13.4@jar") {
		transitive = false
	}

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	if (providers.gradleProperty("withModMenu").map(String::toBoolean).getOrElse(false)) {
		localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.named("test") {
	useJUnitPlatform()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
